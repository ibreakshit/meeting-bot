x-app: &app
  image: meeting-bot:local
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile.development
  restart: unless-stopped
  env_file:
    - .env
  extra_hosts:
    - "host.internal:host-gateway"

x-shared-environment: &shared-environment
  NODE_ENV: development
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-jobs:meetbot:list}
  NOTIFY_REDIS_ENABLED: "true"
  NOTIFY_REDIS_URI: ""
  NOTIFY_REDIS_DB: "0"
  NOTIFY_REDIS_LIST: ${NOTIFY_REDIS_LIST:-jobs:meetbot:recordings}
  NOTIFY_REDIS_FAILURE_LIST: ${NOTIFY_REDIS_FAILURE_LIST:-jobs:meetbot:failures}

x-worker-environment: &worker-environment
  <<: *shared-environment
  REDIS_CONSUMER_ENABLED: "true"
  AUTH_BASE_URL_V2: http://calendar-scheduler:3001/v2
  NOTIFY_WEBHOOK_ENABLED: "true"
  NOTIFY_WEBHOOK_URL: http://calendar-scheduler:3001/hooks/recording-completed
  GOOGLE_CHROME_USER_DATA_DIR: /usr/src/app/.chrome/google-meet-profile
  GOOGLE_CHROME_STORAGE_STATE_PATH: ""
  CHROME_USER_DATA_DIR: /usr/src/app/.chrome

x-chrome: &chrome
  image: meeting-bot-chrome:local
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile.chrome-cdp
  restart: unless-stopped
  shm_size: "1gb"
  expose:
    - "9223"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9223/json/version"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --no-appendfsync-on-rewrite
      - "no"
      - --aof-load-truncated
      - "no"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cache:/data

  calendar-scheduler:
    <<: *app
    environment:
      <<: *shared-environment
      SCHEDULER_PORT: "3001"
      SCHEDULER_STATE_PATH: /data/scheduler-state.json
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - scheduler-state:/data
    command: ["npx", "ts-node", "src/scheduler/index.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  meeting-bot-1:
    <<: *app
    environment:
      <<: *worker-environment
      REDIS_PROCESSING_QUEUE_NAME: jobs:meetbot:processing:1
      CHROME_CDP_URL: http://chrome-cdp-1:9223
    expose:
      - "3000"
    volumes:
      - worker-1-profile:/usr/src/app/.chrome
      # Runtime data stays private; compiled code and dependencies come from the image.
      - worker-1-recordings:/usr/src/app/dist/_tempvideo
      - worker-1-debug:/usr/src/app/debug-videos
      - worker-1-screenshots:/usr/src/app/assets/screenshots
    command: ["/bin/bash", "./start.sh"]
    depends_on:
      redis:
        condition: service_healthy
      calendar-scheduler:
        condition: service_healthy
      chrome-cdp-1:
        condition: service_healthy

  meeting-bot-2:
    <<: *app
    environment:
      <<: *worker-environment
      REDIS_PROCESSING_QUEUE_NAME: jobs:meetbot:processing:2
      CHROME_CDP_URL: http://chrome-cdp-2:9223
    expose:
      - "3000"
    volumes:
      - worker-2-profile:/usr/src/app/.chrome
      - worker-2-recordings:/usr/src/app/dist/_tempvideo
      - worker-2-debug:/usr/src/app/debug-videos
      - worker-2-screenshots:/usr/src/app/assets/screenshots
    command: ["/bin/bash", "./start.sh"]
    depends_on:
      redis:
        condition: service_healthy
      calendar-scheduler:
        condition: service_healthy
      chrome-cdp-2:
        condition: service_healthy

  chrome-cdp-1:
    <<: *chrome
    volumes:
      - chrome-1-profile:/tmp/chrome-profile

  chrome-cdp-2:
    <<: *chrome
    volumes:
      - chrome-2-profile:/tmp/chrome-profile

volumes:
  cache:
  scheduler-state:
  worker-1-profile:
  worker-1-recordings:
  worker-1-debug:
  worker-1-screenshots:
  worker-2-profile:
  worker-2-recordings:
  worker-2-debug:
  worker-2-screenshots:
  chrome-1-profile:
  chrome-2-profile:
